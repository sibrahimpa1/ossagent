version: '3.8'

services:
  # FastAPI backend
  app:
    container_name: foodporn_app
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ayurveda123}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - EXTRACTION_MODEL=claude-opus-4-8
      - SUGGESTION_MODEL=claude-sonnet-4-6
      - ADMIN_TOKEN=${ADMIN_TOKEN:-test123}
    depends_on:
      - neo4j
      - qdrant
    networks:
      - foodporn_network
    restart: unless-stopped

  # Caddy reverse proxy (TLS termination)
  caddy:
    container_name: foodporn_caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/app/frontend/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - foodporn_network
    restart: unless-stopped

  # Neo4j graph database
  neo4j:
    container_name: foodporn_neo4j
    image: neo4j:5.15
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-ayurveda123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./data/neo4j:/data
    networks:
      - foodporn_network
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    container_name: foodporn_qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - foodporn_network
    restart: unless-stopped

networks:
  foodporn_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
