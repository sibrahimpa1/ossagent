name: Check and Fix Neo4j Password

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 178.128.250.32 >> ~/.ssh/known_hosts

      - name: Check and fix password
        run: |
          ssh root@178.128.250.32 << 'ENDSSH'
            set -e
            cd /opt/legal-rag-poc

            echo "=== Current .env password ==="
            grep NEO4J_PASSWORD .env || echo "NEO4J_PASSWORD not found!"

            echo ""
            echo "=== Fixing password to ayurveda123 ==="
            sed -i 's/NEO4J_PASSWORD=.*/NEO4J_PASSWORD=ayurveda123/' .env

            # Add if missing
            if ! grep -q NEO4J_PASSWORD .env; then
              echo "NEO4J_PASSWORD=ayurveda123" >> .env
            fi

            echo ""
            echo "=== Updated .env password ==="
            grep NEO4J_PASSWORD .env

            echo ""
            echo "=== Restarting app container ==="
            docker compose restart app

            echo ""
            echo "=== Waiting for app to restart ==="
            sleep 10

            echo ""
            echo "=== Container status ==="
            docker compose ps

            echo ""
            echo "=== App logs (last 20 lines) ==="
            docker compose logs --tail=20 app

            echo ""
            echo "=== ✅ Password fix complete! ==="
            echo "Wait 60 seconds for Neo4j rate limit to reset, then test the API."
          ENDSSH
