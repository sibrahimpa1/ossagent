name: Deploy FoodPorn to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'caddy/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 178.128.250.32 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host 178.128.250.32
            ServerAliveInterval 60
            ServerAliveCountMax 120
            TCPKeepAlive yes
          EOF

      - name: Deploy to VPS
        run: |
          ssh root@178.128.250.32 << 'ENDSSH'
            set -e
            cd /opt/legal-rag-poc

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data

            echo "Reloading Caddy..."
            docker compose up -d caddy
            docker compose restart caddy

            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "backend/requirements.txt")
            if echo "$CHANGED" | grep -qE 'backend/(Dockerfile|requirements.txt)'; then
              echo "Dependencies changed — rebuilding app image..."
              docker compose build app
            else
              echo "Code-only change — skipping Docker rebuild (backend is volume-mounted)"
            fi

            echo "Restarting app..."
            docker compose rm -sf app 2>/dev/null || true
            docker compose up -d --force-recreate app neo4j qdrant

            echo "Waiting for API..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
                echo "API up after ${i}s"
                break
              fi
              sleep 2
            done

            curl -sf http://localhost:8000/health || { echo "Health check failed"; docker compose logs --tail=80 app; exit 1; }

            echo "Warming RAG..."
            WARM=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST http://localhost:8000/admin/warm-rag)
            HTTP_CODE=$(echo "$WARM" | grep "HTTP_CODE" | cut -d: -f2)
            BODY=$(echo "$WARM" | sed '/HTTP_CODE/d')
            echo "Response: $BODY"
            echo "HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "RAG warm-up failed with code $HTTP_CODE"
              docker compose logs --tail=100 app
              exit 1
            fi

            curl -sf https://ossagent.net/health || echo "Public TLS check skipped"

            echo "Recent app logs:"
            docker compose logs --tail=30 app
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Deployment successful"
          else
            echo "Deployment failed"
            exit 1
          fi
