name: Build Qdrant Vectors

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 178.128.250.32 >> ~/.ssh/known_hosts

      - name: Build Qdrant vectors
        run: |
          ssh root@178.128.250.32 << 'ENDSSH'
            set -e
            cd /opt/legal-rag-poc

            echo "=== Current container status ==="
            docker compose ps

            echo ""
            echo "=== Checking Neo4j connection ==="
            docker compose exec -T neo4j cypher-shell -u neo4j -p ayurveda123 "RETURN 1"

            echo ""
            echo "=== Checking recipe count ==="
            RECIPE_COUNT=$(docker compose exec -T neo4j cypher-shell -u neo4j -p ayurveda123 "MATCH (n:Recipe) RETURN count(n) AS count" --format plain | tail -1 | tr -d '"' || echo "0")
            echo "Neo4j has $RECIPE_COUNT recipes"

            echo ""
            echo "=== Building Qdrant vectors (this may take a few minutes) ==="
            docker compose run --rm app python3 build_vectors.py

            echo ""
            echo "=== Restarting app container ==="
            docker compose restart app

            echo ""
            echo "=== Waiting for API to be ready ==="
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
                echo "✓ API ready after ${i} seconds"
                break
              fi
              echo "Waiting... (${i}s)"
              sleep 2
            done

            echo ""
            echo "=== Health check ==="
            curl -s http://localhost:8000/health | python3 -m json.tool || echo "Health check failed"

            echo ""
            echo "=== ✅ Vector build complete! ==="
          ENDSSH
